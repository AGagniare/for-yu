<style>
/* Layout: one-screen glowing screen with the title and page switch above it */
:root {
  --bg: #120d10;
  --panel: #1d1418;
  --line: #33242c;
  --accent: #ff8fc8;
  --glow: rgba(255, 143, 200, .5);
  --font-display: "Major Mono Display", "JetBrains Mono", ui-monospace, monospace;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-braille: "DejaVu Sans Mono", "Segoe UI Symbol", "Apple Braille", "Noto Sans Symbols 2", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--accent);
  font-family: var(--font-mono);
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  gap: 12px; box-sizing: border-box; overflow: hidden;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.8rem; margin: 0; color: var(--accent); text-shadow: 0 0 10px var(--glow); }
nav { display: flex; gap: 6px; }
nav button {
  font: inherit; font-size: .8rem; color: var(--accent); background: var(--panel);
  border: 1px solid var(--line); padding: 6px 14px; cursor: pointer; border-radius: 3px;
}
nav button[aria-pressed="true"] { color: var(--bg); background: var(--accent); border-color: var(--accent); }
nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.screenWrap {
  flex: 1 0 auto; min-height: clamp(320px, 70vh, 760px); position: relative; border: 1px solid var(--line); border-radius: 4px;
  background: radial-gradient(ellipse at center, #22151c 0%, var(--bg) 75%);
  overflow: hidden; touch-action: none; cursor: pointer;
}
.screen {
  margin: 0; position: absolute; inset: 0; padding: 8px;
  font-family: var(--font-mono); font-size: 14px; line-height: 1;
  color: var(--accent); white-space: pre; user-select: none;
  text-shadow: 0 0 6px var(--glow);
}
#artScreen { font-family: var(--font-braille); display: flex; align-items: center; justify-content: center; padding: 0; }
#artScreen span { display: block; }
#moonCv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#fw { position: absolute; inset: 0; width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 5px rgba(255, 143, 200, .45)); }
.screenWrap::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.18) 2px 3px);
}
</style>

<div class="screenWrap" id="artWrap" hidden><pre class="screen" id="artScreen" aria-label="ASCII portrait on rippling water"><span id="artText"></span></pre></div>

<script>
(() => {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let view = "moon";

  // ================= Bunny =================
  const screen = document.getElementById("screen");
  const wrap = document.getElementById("bunnyWrap");
  let cols = 80, rows = 40, charW = 8.4, charH = 14;
  const mouse = { x: 0.5, y: 0.5, inside: false };

  function measure() {
    if (wrap.hidden) return;
    const fs = wrap.clientWidth < 500 ? 11 : 14;
    screen.style.fontSize = fs + "px";
    const probe = document.createElement("span");
    probe.textContent = "M".repeat(50);
    probe.style.visibility = "hidden";
    screen.appendChild(probe);
    charW = probe.getBoundingClientRect().width / 50;
    charH = fs;
    probe.remove();
    const r = wrap.getBoundingClientRect();
    cols = Math.max(16, Math.floor((r.width - 16) / charW));
    rows = Math.max(14, Math.floor((r.height - 16) / charH));
  }

  const W = 13;
  const EARS_UP = ["  (\\     /)  ", "  ( \\   / )  "];
  const EARS_TWITCH = ["  (\\     __  ", "  ( \\   /__) "];
  const FEET_SIT = "  (_)   (_)  ";
  const FEET_HOP = "   /|   |\\   ";
  const bun = { x: null, hopping: false, hopStart: 0, from: 0, to: 0, rest: 0, eat: 0, wanderX: 0, wanderT: 0 };
  let carrots = [], hearts = [], lastBT = 0;
  const hash = x => ((x * 2654435761) >>> 0) % 97;

  function put(out, x, y, s) {
    x = Math.round(x); y = Math.round(y);
    if (y < 0 || y >= rows) return;
    for (let i = 0; i < s.length; i++) {
      const c = s[i], cx = x + i;
      if (c !== " " && cx >= 0 && cx < cols) out[cx + y * cols] = c;
    }
  }

  function bunny(t) {
    const dt = Math.min(0.05, Math.max(0, t - lastBT)); lastBT = t;
    const out = new Array(cols * rows).fill(" ");
    const gy = rows - 3;
    if (bun.x === null || bun.x > cols - W) bun.x = Math.max(0, (cols - W) / 2);

    for (let x = 0; x < cols; x++) {
      const h = hash(x);
      out[x + (rows - 2) * cols] = h % 7 === 0 ? "," : h % 5 === 0 ? "." : "_";
      if (h % 3 === 0) out[x + (rows - 1) * cols] = ".";
      if (h % 11 === 0) out[x + gy * cols] = h % 2 ? "'" : ",";
    }

    for (const c of carrots) {
      if (!c.landed) { c.vy += 60 * dt; c.y += c.vy * dt; if (c.y >= gy - 1) { c.y = gy - 1; c.landed = true; } }
    }

    const center = bun.x + 6;
    let target, carrot = null;
    if (carrots.length) {
      carrot = carrots.reduce((a, b) => Math.abs(a.x + 1 - center) < Math.abs(b.x + 1 - center) ? a : b);
      target = carrot.x + 1;
    } else if (mouse.inside) {
      target = mouse.x * cols;
    } else {
      if (t > bun.wanderT) { bun.wanderX = Math.random() * cols; bun.wanderT = t + 3 + Math.random() * 4; }
      target = bun.wanderX;
    }

    let height = 0;
    if (bun.eat > 0) {
      bun.eat -= dt;
      if (bun.eat <= 0) for (let i = 0; i < 3; i++) hearts.push({ x: bun.x + 3 + i * 3, y: gy - 8, life: 1.4 + i * 0.2 });
    } else if (bun.hopping) {
      const p = (t - bun.hopStart) / 0.45;
      if (p >= 1) { bun.x = bun.to; bun.hopping = false; bun.rest = 0.18; }
      else { bun.x = bun.from + (bun.to - bun.from) * p; height = 4 * Math.sin(Math.PI * p); }
    } else {
      bun.rest -= dt;
      const d = target - center;
      if (bun.rest <= 0 && Math.abs(d) > 1.5) {
        bun.hopping = true; bun.hopStart = t; bun.from = bun.x;
        bun.to = Math.max(0, Math.min(cols - W, bun.x + Math.max(-9, Math.min(9, d))));
      }
    }

    if (!bun.hopping && bun.eat <= 0 && carrot && carrot.landed && Math.abs(carrot.x + 1 - (bun.x + 6)) <= 2.5) {
      carrots.splice(carrots.indexOf(carrot), 1);
      bun.eat = 1.2;
    }

    const look = bun.eat > 0 ? 0 : Math.abs(target - (bun.x + 6)) > 3 ? Math.sign(target - (bun.x + 6)) : 0;
    const blink = t % 3.3 < 0.15;
    const eye = bun.eat > 0 ? "^" : blink ? "-" : "o";
    const eyes = look < 0 ? ` | ${eye}   ${eye}   | ` : look > 0 ? ` |   ${eye}   ${eye} | ` : ` |  ${eye}   ${eye}  | `;
    const mouth = bun.eat > 0 ? (Math.floor(t / 0.15) % 2 ? "o" : "w") : "w";
    const ears = t % 5.7 < 0.3 ? EARS_TWITCH : EARS_UP;
    const sprite = [
      ears[0], ears[1],
      "   \\ \\ / /   ",
      "  /       \\  ",
      eyes,
      `=|    ${mouth}    |=`,
      "  \\_______/  ",
      height > 0.5 ? FEET_HOP : FEET_SIT,
    ];
    const by = gy - 7 - Math.round(height);
    if (height >= 1) put(out, bun.x + 2, gy, ".:::::::.");
    sprite.forEach((line, i) => put(out, bun.x, by + i, line));
    if (bun.eat > 0) put(out, bun.x + 3, by - 1, "nom nom");

    for (const c of carrots) { put(out, c.x, c.y, "\\|/"); put(out, c.x, c.y + 1, " V "); }
    hearts = hearts.filter(h => (h.life -= dt) > 0);
    for (const h of hearts) { h.y -= 5 * dt; put(out, h.x, h.y, "<3"); }
    return out;
  }

  function setPos(e) {
    const r = wrap.getBoundingClientRect();
    mouse.x = (e.clientX - r.left - 8) / (r.width - 16);
    mouse.y = (e.clientY - r.top - 8) / (r.height - 16);
  }
  wrap.addEventListener("pointerdown", e => {
    mouse.inside = true; setPos(e);
    if (carrots.length < 8) carrots.push({ x: Math.max(0, Math.min(cols - 3, Math.round(mouse.x * cols) - 1)), y: Math.max(0, mouse.y * rows), vy: 0, landed: false });
  });
  wrap.addEventListener("pointermove", e => { mouse.inside = true; setPos(e); });
  wrap.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") mouse.inside = false; });

  // ================= Her (pond ripples) =================
  const ART = ["\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2818\u28a6\u2840\u2800\u2808\u28a6\u2840\u2800\u2800\u2800\u28bf\u2800\u2800\u2838\u2847\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2808\u28a7\u2840\u2800\u2808\u28b7\u2844\u2800\u2800\u28b8\u2847\u2800\u2800\u28b9\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2818\u28b7\u2840\u2800\u2800\u2831\u2844\u2800\u2808\u28ff\u2800\u2800\u2838\u28e7\u2884\u28c0\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28c0\u28c0\u28c0\u28c0\u28c0\u28c0\u28c0\u28e4\u28e4\u28f4\u28f6\u28f6\u28f6\u28f6\u28f6\u2876\u2826\u28e4\u28c4\u28c0\u28b3\u2840\u2800\u2800\u2819\u28c6\u2800\u28bb\u2800\u2800\u2840\u28b9\u285f\u2809\u2809\u28b7\u28e4\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2880\u28e0\u2834\u2896\u28eb\u28fd\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f7\u2844\u2800\u2800\u2808\u2833\u28fe\u28f4\u280e\u28b1\u287e\u2801\u2800\u2800\u28a0\u28ec\u2809\u2819\u2832\u28e6\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2880\u28f4\u28be\u28ff\u28ff\u28fe\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2844\u2800\u2800\u2800\u2800\u2808\u2880\u285e\u2801\u2800\u2800\u2880\u285f\u2801\u2800\u2800\u2800\u2808\u28f7\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28c0\u28f4\u28ef\u28f6\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f7\u2800\u2800\u2800\u2880\u2874\u283b\u28e7\u2800\u2800\u28a0\u287e\u2800\u2800\u2800\u2880\u287c\u2803\u2838\u2846\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28e0\u28fe\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28c7\u28c0\u2874\u280b\u2800\u2800\u285f\u2800\u2800\u287e\u2801\u2800\u2800\u28a0\u287e\u2833\u2806\u2800\u28bb\u2844\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2880\u28f4\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u287f\u283f\u281b\u281b\u2806\u2800\u2880\u28fc\u2847\u2800\u28b8\u28c7\u28c0\u2800\u2880\u285e\u281b\u2813\u2836\u2836\u280b\u28bb\u2844\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2880\u28fe\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u284f\u2800\u2800\u2800\u2800\u2800\u28e0\u280b\u2838\u2847\u28b0\u28fe\u2800\u2808\u28c7\u28fe\u2803\u2800\u2800\u2800\u2800\u2800\u2800\u28b1\u2844\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2880\u28fc\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28e7\u2800\u2800\u2800\u2810\u28fb\u28ff\u2833\u28e6\u2847\u28b0\u28ff\u2840\u2880\u28ff\u2803\u2846\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28bb\u28c6\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28e0\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f7\u2844\u2800\u28a0\u284f\u28b8\u2800\u2800\u2819\u281b\u2839\u28f7\u280b\u2801\u2800\u2847\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u283b\u2844\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28f0\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28c6\u2800\u2800\u2818\u2803\u2800\u2800\u2800\u2800\u2808\u2833\u28c4\u2800\u2887\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u283b\u28c4\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u28f0\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2846\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2808\u2833\u28fe\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2819\u281b\u2833\u2826\u28e4\u28c0\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u28b0\u28bf\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u284f\u28bf\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f6\u28e4\u28c0\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2818\u28a7\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2809\u281b\u2833\u2826\u2824\u28c4\u28c0\u2840\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2880\u284f\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f7\u2808\u28bf\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28e6\u28c4\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2819\u28a6\u28c4\u28c0\u28c0\u28c0\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2809\u2809\u281b\u2837\u2826\u28a4\u28c4\u2840", "\u2800\u2800\u2800\u2800\u28f8\u28f7\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2800\u2880\u28fd\u28ff\u28ff\u2859\u28bf\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f7\u28e4\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2830\u2836\u2836\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2808", "\u2800\u2800\u2800\u2800\u28ff\u28b8\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u280b\u2809\u2800\u2808\u281b\u28ff\u28ee\u287b\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f7\u28f6\u28f6\u28e4\u28c4\u28c0\u2800\u2800\u2800\u2809\u2801\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u28ff\u28fc\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u280b\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2800\u2800\u2800\u2800\u2800\u2808\u2819\u28f7\u28dd\u28bb\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u284f\u2809\u2819\u2813\u2836\u28a4\u28c4\u28c0\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u284f\u2800\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2847\u28ff\u2800\u28a0\u2864\u2824\u2824\u2824\u2824\u28ec\u28ff\u28f7\u28fd\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f7\u2847\u2800\u2800\u2800\u2800\u2808\u2809\u281b\u2812\u28a4\u28e4\u28c0\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u285f\u2800\u2808\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28b7\u285f\u28e0\u281f\u2801\u2800\u28c0\u28e0\u28ed\u28ff\u28e7\u28ff\u28e9\u287f\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2847\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2809\u281b\u2836\u2826\u2884\u28c0\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u285f\u2800\u2800\u2800\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28fe\u2837\u2803\u2880\u28e4\u28ff\u28ff\u28ff\u28cb\u28fd\u28db\u28ff\u2849\u2819\u281b\u28bb\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2847\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2808\u2819\u2833\u2826\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u28bd\u28ff\u28b9\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f7\u287f\u2832\u2836\u28e4\u28f6\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28bf\u284f\u2800\u2880\u28ff\u280f\u28bb\u28c7\u2839\u281f\u28c3\u2800\u28f8\u28ff\u2844\u2820\u28fe\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2819\u28ff\u28ff\u28ff\u2847\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2808\u2802\u2884", "\u2800\u2800\u2800\u2800\u28b8\u28ff\u28b8\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u285f\u2800\u2800\u2800\u2800\u2800\u28fb\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u287e\u2800\u2800\u2809\u2800\u2820\u283e\u281b\u281b\u283b\u281b\u2809\u2809\u2809\u2801\u2880\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2800\u2838\u28ff\u28ff\u2847\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2838\u28ff\u285c\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u283e\u28bf\u28ff\u283f\u28bf\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u287f\u2809\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2880\u2800\u2800\u2800\u28f8\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2800\u2800\u28ff\u28ff\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u28ff\u28c7\u28bb\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u280b\u28b8\u28ff\u2800\u2818\u28ff\u2801\u28d8\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u287f\u2801\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2846\u2800\u28ff\u28ff\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u28bb\u28ff\u28fc\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u284f\u2800\u2808\u28bb\u28e6\u28e4\u2874\u281e\u280b\u28bb\u28ff\u28ff\u28ff\u28ff\u287f\u2801\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f7\u2800\u28ff\u28ff\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u28b8\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28e7\u28a4\u28fc\u283f\u281f\u280b\u2800\u2800\u2800\u28fe\u28ff\u28ff\u28ff\u287f\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28ff\u2847\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u285f\u28ff\u28e4\u28ff\u2847\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2838\u28f7\u281a\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2847\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28a0\u28ff\u28ff\u28ff\u28ff\u2803\u2800\u2800\u2800\u2800\u2800\u2800\u2880\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28b0\u28ff\u2801\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2800\u28ff\u287f\u28fc\u2807\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u28bf\u2844\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2847\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28b8\u28ff\u28ff\u28ff\u284f\u2800\u2800\u2800\u2800\u2808\u2803\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2808\u28ff\u28f6\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28fe\u284f\u28e0\u280f\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2808\u28bf\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2847\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28b8\u28ff\u28ff\u28ff\u2801\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28c0\u28e0\u28e4\u28e4\u28f6\u28e4\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28c5\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2808\u28ff\u28ff\u28bb\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f7\u2844\u2800\u2800\u2800\u2800\u2800\u2800\u28b8\u28ff\u28ff\u284f\u2800\u2800\u2800\u2880\u2874\u2896\u28db\u28ed\u28fd\u28ff\u28ff\u28ff\u28f6\u28ff\u28f7\u2800\u2800\u2800\u2800\u2800\u2800\u28bb\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f9\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2818\u28ff\u28fc\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28c6\u2800\u2800\u2800\u2800\u2800\u28b8\u28ff\u28ff\u2847\u2800\u2800\u2800\u28b8\u28e7\u28ff\u28ff\u28ff\u28ff\u287f\u281f\u281b\u281b\u28bf\u28ff\u2843\u2800\u2800\u2800\u2800\u2800\u28fc\u28ff\u28fe\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2803\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2839\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2819\u28a7\u2840\u2800\u2800\u2800\u2800\u28ff\u28ff\u28c7\u2800\u2800\u2800\u2808\u28bf\u28ff\u280f\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28ff\u2801\u2800\u2800\u2800\u2800\u28f0\u287f\u28bf\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u287f\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2839\u28ff\u28ff\u285f\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28e7\u286e\u28b7\u28c4\u2800\u2800\u2800\u28bb\u284c\u28ff\u2840\u2800\u2800\u2800\u2818\u28ff\u2844\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28ff\u2800\u2800\u2800\u2800\u28f4\u287f\u2881\u287e\u28fb\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2803\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2818\u28ff\u28f7\u2858\u28bf\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28c6\u2800\u2819\u2837\u28c4\u2800\u2808\u28bf\u28fc\u28e7\u2800\u2800\u2800\u2800\u2808\u283b\u28c4\u2800\u2800\u2800\u2800\u2880\u287c\u2803\u2800\u2800\u2810\u281b\u280b\u28e0\u280f\u2800\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28cb\u281d\u2803\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28b9\u28ff\u287f\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28e7\u2840\u2800\u2808\u281b\u28a6\u28c4\u2849\u2819\u28b7\u28c4\u2800\u2800\u2800\u2800\u2808\u2819\u281b\u281b\u280b\u2809\u2800\u2800\u2800\u2800\u2800\u28a0\u287e\u2803\u2800\u28f8\u28ff\u28ff\u28ff\u28e6\u2859\u283f\u28f7\u2840\u2800\u2800\u2800\u2800\u2880\u28c4\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2820\u280a", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28bf\u28ff\u2801\u2809\u28bb\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28e6\u28c0\u2800\u2880\u28fb\u28ff\u2877\u28a6\u28c8\u2801\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2880\u28f4\u280f\u2800\u2800\u28e0\u28ff\u28b9\u28ff\u28ff\u28ff\u28ff\u28f6\u28ff\u28ff\u28e4\u28e4\u28f4\u28fe\u281f\u2801\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2880\u28c0\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2808\u283b\u28e7\u2840\u2808\u281b\u28bf\u28ff\u28ff\u28bb\u28ff\u28ff\u28ff\u285d\u281b\u2833\u28f6\u28ff\u280f\u28f7\u2840\u2809\u281b\u2832\u2826\u28e4\u28c0\u2840\u2800\u2800\u2800\u2800\u2800\u28e0\u2874\u281f\u2801\u2800\u2800\u2800\u280b\u2801\u28f8\u28ff\u28ff\u28ff\u28ff\u28df\u285b\u281b\u281b\u281b\u280b\u2801\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28c0\u28e4\u2834\u2812\u281b\u280b\u2809\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2819\u28b7\u28c0\u2800\u28b8\u28bb\u287f\u2800\u2839\u28ff\u28ff\u283f\u28e6\u28c4\u2818\u280b\u2800\u2818\u28e7\u2800\u2800\u2800\u2800\u2800\u2809\u281b\u2813\u2812\u2812\u281a\u281b\u2809\u2800\u2800\u2800     }
    const ox = Math.cos(a) * d / 2, oy = Math.sin(a) * d / 2 * 0.55;
    const heat = t < M_SPIRAL ? 0 : Math.min(1, (t - M_SPIRAL) / (M_BANG - M_SPIRAL));
    return { mcx: S.cx - ox, mcy: S.cy - oy + bob, scx: S.cx + ox, scy: S.cy + oy - bob, heat };
  }

  function dot(x, y, I, r, g, b) {
    if (I <= 0.22) return;
    const br = 0.35 + 0.65 * Math.min(1, I * 1.1);
    const q = (Math.min(15, Math.max(0, Math.round(r * br / 17))) << 8) | (Math.min(15, Math.max(0, Math.round(g * br / 17))) << 4) | Math.min(15, Math.max(0, Math.round(b * br / 17)));
    mctx.fillStyle = QCOL[q];
    mctx.fillRect(mOx + Math.round(x) * mSp - 1.3, mOy + Math.round(y) * mSp - 1.3, 2.6, 2.6);
  }

  // where every moon/star dot is at time t (moon gets tidally stretched toward the star)
  function bodyPoint(S, B, i) {
    if (i < S.nm) {
      let dx = B.scx - B.mcx, dy = B.scy - B.mcy; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      const st = 1 + 0.45 * B.heat * B.heat, along = (S.mx[i] * dx + S.my[i] * dy) * (st - 1);
      return [S.mx[i] + along * dx + B.mcx, S.my[i] + along * dy + B.mcy];
    }
    const j = i - S.nm, k = 1 - 0.3 * B.heat;
    return [S.sx[j] * k + B.scx, S.sy[j] * k + B.scy];
  }

  function moonStar(time) {
    if (!ms) measureMoon();
    const S = ms, t = time % M_END;
    const r = moonWrap.getBoundingClientRect();
    mctx.fillStyle = "#08060c"; mctx.fillRect(0, 0, r.width, r.height);
    let fade = 1;
    if (t > M_HOLD) fade = Math.max(0, 1 - (t - M_HOLD) / (M_END - M_HOLD));
    if (t < 1) fade = t;

    for (const [x, y, ph, sp] of S.bg) {
      const tw = Math.sin(t * sp + ph);
      if (tw > 0.1) dot(x, y, 0.35 + 0.3 * tw, 170 * fade, 160 * fade, 200 * fade);
    }

    if (t < M_BANG) {
      const trail = t < M_SPIRAL ? [0] : [0, 0.05, 0.1];
      for (let k = trail.length - 1; k >= 0; k--) {
        const tt = t - trail[k], B = bodies(S, tt), hot = B.heat * B.heat, dim = (1 - k * 0.3) * fade, jit = B.heat * 2.4;
        // moon, lit by the star so its phase follows the orbit
        let Lx = B.scx - B.mcx, Ly = B.scy - B.mcy, Lz = S.Wd * 0.3; const ll = Math.hypot(Lx, Ly, Lz); Lx /= ll; Ly /= ll; Lz /= ll;
        for (let i = 0; i < S.nm; i++) {
          const lam = Math.max(0, S.nX[i] * Lx + S.nY[i] * Ly + S.nZ[i] * Lz);
          let br = lam * S.alb[i] * (0.78 + 0.22 * S.nZ[i]) + 0.018 * S.alb[i];
          br *= 1 + 2.5 * hot;
          if (br <= S.dith[i] * 1.05 + 0.06) continue;
          const [x, y] = bodyPoint(S, B, i);
          const f = Math.min(1.2, 0.4 + 0.6 * br);
          const c = [226 * f, 222 * f, 214 * f].map((v, j) => (v * (1 - hot) + (C_WHITE[j] * 0.6 + C_PINK[j] * 0.4) * hot) * dim);
          dot(x + (S.rnd() - 0.5) * jit, y + (S.rnd() - 0.5) * jit, dim, c[0], c[1], c[2]);
        }
        // star: twinkling glow, breathing spikes
        const tw = 0.82 + 0.18 * Math.sin(tt * 6.3) * Math.sin(tt * 2.1 + 1), reach = 0.7 + 0.3 * tw + 0.3 * B.heat;
        for (let j = 0; j < S.ns; j++) {
          const core = S.sk[j] === 0 && S.sb[j] >= 0.999;
          if (S.sk[j] === 1 && S.sf[j] >= reach) continue;
          if (!core && Math.sin(tt * 9 + S.sph[j]) <= -0.6) continue;
          const [x, y] = bodyPoint(S, B, S.nm + j);
          const b = Math.min(1.3, S.sb[j] * tw * (1 + hot)), f = 0.35 + 0.65 * b;
          const c = S.scol[j].map((v, q) => Math.min(255, (v * f * (1 - hot) + C_WHITE[q] * hot) * dim));
          dot(x + (S.rnd() - 0.5) * jit, y + (S.rnd() - 0.5) * jit, dim, c[0], c[1], c[2]);
        }
      }
      return;
    }

    // after the bang: every target dot flies out, then home to its place in the drawing
    const B0 = bodies(S, M_BANG - 1e-3), kd = 2.2, tb = t - M_BANG;
    if (tb < 1.6) {
      if (tb < 0.5) {
        const rr = 4 + tb * 50, a = 1 - tb / 0.5;
        for (let y = -Math.ceil(rr); y <= rr; y++) for (let x = -Math.ceil(rr); x <= rr; x++)
          if (x * x + y * y <= rr * rr) dot(S.cx + x, S.cy + y, a * 0.9, 255, 248, 252);
      }
      const rs = tb * 140, n = Math.floor(20 + rs * 4), a = Math.max(0, 1 - tb / 1.6);
      for (let i = 0; i < n; i++) { const an = i / n * 6.283; dot(S.cx + Math.cos(an) * rs, S.cy + Math.sin(an) * rs * 0.8, a, 255 * 0.6 + 255 * 0.4, 143 * 0.6 + 248 * 0.4, 200 * 0.6 + 252 * 0.4); }
    }
    const trails = t > M_FORM ? [0] : [0, 0.05, 0.1];
    for (let kk = trails.length - 1; kk >= 0; kk--) {
      const tt = t - trails[kk], te = Math.max(0, tt - M_BANG), ex = (1 - Math.exp(-kd * te)) / kd;
      const heat = Math.max(0, Math.min(1, 1 - (tt - M_BANG) / 1.2)), inten = (1 - kk * 0.3) * fade, cm = 1 - kk * 0.25;
      for (let i = 0; i < S.N; i++) {
        const [px0, py0] = bodyPoint(S, B0, S.src[i]);
        const qx = px0 + S.vx[i] * ex, qy = py0 + S.vy[i] * ex;
        const p = easeP((tt - M_EXPLODE - S.delay[i]) / 1.8);
        const dx = S.tx[i] - qx, dy = S.ty[i] - qy, dl = Math.hypot(dx, dy) + 1e-6, sw = S.swirl[i] * Math.sin(Math.PI * p);
        const x = qx + dx * p - dy / dl * sw, y = qy + dy * p + dx / dl * sw;
        const f = S.ty[i] / S.Hd, tc0 = C_PINK[0] * (1 - f) + C_LAV[0] * f, tc1 = C_PINK[1] * (1 - f) + C_LAV[1] * f, tc2 = C_PINK[2] * (1 - f) + C_LAV[2] * f;
        dot(x, y, inten,
          (tc0 * p + (255 * heat + 255 * (1 - heat)) * (1 - p)) * cm,
          (tc1 * p + (248 * heat + 143 * (1 - heat)) * (1 - p)) * cm,
          (tc2 * p + (252 * heat + 200 * (1 - heat)) * (1 - p)) * cm);
      }
    }
    if (t > M_FORM - 0.5) {
      const sweep = (t - M_FORM) / (M_HOLD - M_FORM) * (S.Wd + 80) - 40;
      for (let i = 0; i < S.N; i++) {
        const f = S.ty[i] / S.Hd, g = 1 + Math.exp(-(((S.tx[i] - sweep) / 14) ** 2)) * 0.55;
        dot(S.tx[i], S.ty[i], fade, Math.min(255, (C_PINK[0] * (1 - f) + C_LAV[0] * f) * g), Math.min(255, (C_PINK[1] * (1 - f) + C_LAV[1] * f) * g), Math.min(255, (C_PINK[2] * (1 - f) + C_LAV[2] * f) * g));
      }
    }
  }

  moonWrap.addEventListener("pointerdown", () => { mT0 = performance.now(); });

  // ================= Views + loop =================
  function show(v) {
    view = ["moon", "fireworks", "bunny", "her"].includes(v) ? v : "moon";
    document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === view));
    wrap.hidden = view !== "bunny";
    artWrap.hidden = view !== "her";
    fwWrap.hidden = view !== "fireworks";
    moonWrap.hidden = view !== "moon";
    if (view === "moon") mT0 = performance.now();
    try { history.replaceState(null, "", "#" + view); } catch (e) {}
    measure(); measureArt(); measureFw(); measureMoon();
  }
  document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => show(b.dataset.view)));

  const t0 = performance.now();
  function frame(now) {
    const t = (now - t0) / 1000;
    if (view === "moon") {
      moonStar(Math.max(0, now - mT0) / 1000);
    } else if (view === "fireworks") {
      fireworks(t);
    } else if (view === "bunny") {
      const out = bunny(t);
      let s = "";
      for (let y = 0; y < rows; y++) s += out.slice(y * cols, y * cols + cols).join("") + "\n";
      screen.textContent = s;
    } else {
      pond(t);
    }
    if (reduce) setTimeout(() => requestAnimationFrame(frame), 120); else requestAnimationFrame(frame);
  }

  new ResizeObserver(() => { measure(); measureArt(); measureFw(); measureMoon(); }).observe(document.body);
  document.fonts.ready.then(() => { measure(); measureArt(); measureFw(); measureMoon(); });
  show(location.hash.slice(1));
  requestAnimationFrame(frame);
})();
</script>

</body>
