<style>
/* Layout: one-screen glowing screen with the title and page switch above it */
:root {
  --bg: #120d10;
  --panel: #1d1418;
  --line: #33242c;
  --accent: #ff8fc8;
  --glow: rgba(255, 143, 200, .5);
  --font-display: "Major Mono Display", "JetBrains Mono", ui-monospace, monospace;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-braille: "DejaVu Sans Mono", "Segoe UI Symbol", "Apple Braille", "Noto Sans Symbols 2", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--accent);
  font-family: var(--font-mono);
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  gap: 12px; box-sizing: border-box; overflow: hidden;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.8rem; margin: 0; color: var(--accent); text-shadow: 0 0 10px var(--glow); }
nav { display: flex; gap: 6px; flex-wrap: wrap; }
nav button { white-space: nowrap; }
nav button {
  font: inherit; font-size: .8rem; color: var(--accent); background: var(--panel);
  border: 1px solid var(--line); padding: 6px 14px; cursor: pointer; border-radius: 3px;
}
nav button[aria-pressed="true"] { color: var(--bg); background: var(--accent); border-color: var(--accent); }
nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.screenWrap {
  flex: 1 0 auto; min-height: clamp(300px, 60vh, 760px); position: relative; border: 1px solid var(--line); border-radius: 4px;
  background: radial-gradient(ellipse at center, #22151c 0%, var(--bg) 75%);
  overflow: hidden; touch-action: none; cursor: pointer;
}
.screen {
  margin: 0; position: absolute; inset: 0; padding: 8px;
  font-family: var(--font-mono); font-size: 14px; line-height: 1;
  color: var(--accent); white-space: pre; user-select: none;
  text-shadow: 0 0 6px var(--glow);
}
#artScreen { font-family: var(--font-braille); display: flex; align-items: center; justify-content: center; padding: 0; }
#artScreen span { display: block; }
#sealCv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#vapeCv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#smokeCv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#moonCv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#fw { position: absolute; inset: 0; width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 5px rgba(255, 143, 200, .45)); }
.screenWrap::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.18) 2px 3px);
}
</style>

<script>
(() => {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let view = "moon";

  // ================= Bunny =================
  const screen = document.getElementById("screen");
  const wrap = document.getElementById("bunnyWrap");
  let cols = 80, rows = 40, charW = 8.4, charH = 14;
  const mouse = { x: 0.5, y: 0.5, inside: false };

  function measure() {
    if (wrap.hidden) return;
    const fs = wrap.clientWidth < 500 ? 11 : 14;
    screen.style.fontSize = fs + "px";
    const probe = document.createElement("span");
    probe.textContent = "M".repeat(50);
    probe.style.visibility = "hidden";
    screen.appendChild(probe);
    charW = probe.getBoundingClientRect().width / 50;
    charH = fs;
    probe.remove();
    const r = wrap.getBoundingClientRect();
    cols = Math.max(16, Math.floor((r.width - 16) / charW));
    rows = Math.max(14, Math.floor((r.height - 16) / charH));
  }

  const W = 13;
  const EARS_UP = ["  (\\     /)  ", "  ( \\   / )  "];
  const EARS_TWITCH = ["  (\\     __  ", "  ( \\   /__) "];
  const FEET_SIT = "  (_)   (_)  ";
  const FEET_HOP = "   /|   |\\   ";
  const bun = { x: null, hopping: false, hopStart: 0, from: 0, to: 0, rest: 0, eat: 0, wanderX: 0, wanderT: 0 };
  let carrots = [], hearts = [], lastBT = 0;
  const hash = x => ((x * 2654435761) >>> 0) % 97;

  function put(out, x, y, s) {
    x = Math.round(x); y = Math.round(y);
    if (y < 0 || y >= rows) return;
    for (let i = 0; i < s.length; i++) {
      const c = s[i], cx = x + i;
      if (c !== " " && cx >= 0 && cx < cols) out[cx + y * cols] = c;
    }
  }

  function bunny(t) {
    const dt = Math.min(0.05, Math.max(0, t - lastBT)); lastBT = t;
    const out = new Array(cols * rows).fill(" ");
    const gy = rows - 3;
    if (bun.x === null || bun.x > cols - W) bun.x = Math.max(0, (cols - W) / 2);

    for (let x = 0; x < cols; x++) {
      const h = hash(x);
      out[x + (rows - 2) * cols] = h % 7 === 0 ? "," : h % 5 === 0 ? "." : "_";
      if (h % 3 === 0) out[x + (rows - 1) * cols] = ".";
      if (h % 11 === 0) out[x + gy * cols] = h % 2 ? "'" : ",";
    }

    for (const c of carrots) {
      if (!c.landed) { c.vy += 60 * dt; c.y += c.vy * dt; if (c.y >= gy - 1) { c.y = gy - 1; c.landed = true; } }
    }

    const center = bun.x + 6;
    let target, carrot = null;
    if (carrots.length) {
      carrot = carrots.reduce((a, b) => Math.abs(a.x + 1 - center) < Math.abs(b.x + 1 - center) ? a : b);
      target = carrot.x + 1;
    } else if (mouse.inside) {
      target = mouse.x * cols;
    } else {
      if (t > bun.wanderT) { bun.wanderX = Math.random() * cols; bun.wanderT = t + 3 + Math.random() * 4; }
      target = bun.wanderX;
    }

    let height = 0;
    if (bun.eat > 0) {
      bun.eat -= dt;
      if (bun.eat <= 0) for (let i = 0; i < 3; i++) hearts.push({ x: bun.x + 3 + i * 3, y: gy - 8, life: 1.4 + i * 0.2 });
    } else if (bun.hopping) {
      const p = (t - bun.hopStart) / 0.45;
      if (p >= 1) { bun.x = bun.to; bun.hopping = false; bun.rest = 0.18; }
      else { bun.x = bun.from + (bun.to - bun.from) * p; height = 4 * Math.sin(Math.PI * p); }
    } else {
      bun.rest -= dt;
      const d = target - center;
      if (bun.rest <= 0 && Math.abs(d) > 1.5) {
        bun.hopping = true; bun.hopStart = t; bun.from = bun.x;
        bun.to = Math.max(0, Math.min(cols - W, bun.x + Math.max(-9, Math.min(9, d))));
      }
    }

    if (!bun.hopping && bun.eat <= 0 && carrot && carrot.landed && Math.abs(carrot.x + 1 - (bun.x + 6)) <= 2.5) {
      carrots.splice(carrots.indexOf(carrot), 1);
      bun.eat = 1.2;
    }

    const look = bun.eat > 0 ? 0 : Math.abs(target - (bun.x + 6)) > 3 ? Math.sign(target - (bun.x + 6)) : 0;
    const blink = t % 3.3 < 0.15;
    const eye = bun.eat > 0 ? "^" : blink ? "-" : "o";
    const eyes = look < 0 ? ` | ${eye}   ${eye}   | ` : look > 0 ? ` |   ${eye}   ${eye} | ` : ` |  ${eye}   ${eye}  | `;
    const mouth = bun.eat > 0 ? (Math.floor(t / 0.15) % 2 ? "o" : "w") : "w";
    const ears = t % 5.7 < 0.3 ? EARS_TWITCH : EARS_UP;
    const sprite = [
      ears[0], ears[1],
      "   \\ \\ / /   ",
      "  /       \\  ",
      eyes,
      `=|    ${mouth}    |=`,
      "  \\_______/  ",
      height > 0.5 ? FEET_HOP : FEET_SIT,
    ];
    const by = gy - 7 - Math.round(height);
    if (height >= 1) put(out, bun.x + 2, gy, ".:::::::.");
    sprite.forEach((line, i) => put(out, bun.x, by + i, line));
    if (bun.eat > 0) put(out, bun.x + 3, by - 1, "hehehe");

    for (const c of carrots) { put(out, c.x, c.y, "\\|/"); put(out, c.x, c.y + 1, " V "); }
    hearts = hearts.filter(h => (h.life -= dt) > 0);
    for (const h of hearts) { h.y -= 5 * dt; put(out, h.x, h.y, "<3"); }
    return out;
  }

  function setPos(e) {
    const r = wrap.getBoundingClientRect();
    mouse.x = (e.clientX - r.left - 8) / (r.width - 16);
    mouse.y = (e.clientY - r.top - 8) / (r.height - 16);
  }
  wrap.addEventListener("pointerdown", e => {
    mouse.inside = true; setPos(e);
    if (carrots.length < 8) carrots.push({ x: Math.max(0, Math.min(cols - 3, Math.round(mouse.x * cols) - 1)), y: Math.max(0, mouse.y * rows), vy: 0, landed: false });
  });
  wrap.addEventListener("pointermove", e => { mouse.inside = true; setPos(e); });
  wrap.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") mouse.inside = false; });

  // ================= Her (pond ripples) =================
  const ART = ["\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2818\u28a6\u2840\u2800\u2808\u28a6\u2840\u2800\u2800\u2800\u28bf\u2800\u2800\u2838\u2847\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2808\u28a7\u2840\u2800\u2808\u28b7\u2844\u2800\u2800\u28b8\u2847\u2800\u2800\u28b9\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2818\u28b7\u2840\u2800\u2800\u2831\u2844\u2800\u2808\u28ff\u2800\u2800\u2838\u28e7\u2884\u28c0\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28c0\u28c0\u28c0\u28c0\u28c0\u28c0\u28c0\u28e4\u28e4\u28f4\u28f6\u28f6\u28f6\u28f6\u28f6\u2876\u2826\u28e4\u28c4\u28c0\u28b3\u2840\u2800\u2800\u2819\u28c6\u2800\u28bb\u2800\u2800\u2840\u28b9\u285f\u2809\u2809\u28b7\u28e4\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2880\u28e0\u2834\u2896\u28eb\u28fd\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f7\u2844\u2800\u2800\u2808\u2833\u28fe\u28f4\u280e\u28b1\u287e\u2801\u2800\u2800\u28a0\u28ec\u2809\u2819\u2832\u28e6\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2880\u28f4\u28be\u28ff\u28ff\u28fe\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2844\u2800\u2800\u2800\u2800\u2808\u2880\u285e\u2801\u2800\u2800\u2880\u285f\u2801\u2800\u2800\u2800\u2808\u28f7\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28c0\u28f4\u28ef\u28f6\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f7\u2800\u2800\u2800\u2880\u2874\u283b\u28e7\u2800\u2800\u28a0\u287e\u2800\u2800\u2800\u2880\u287c\u2803\u2838\u2846\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28e0\u28fe\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28c7\u28c0\u2874\u280b\u2800\u2800\u285f\u2800\u2800\u287e\u2801\u2800\u2800\u28a0\u287e\u2833\u2806\u2800\u28bb\u2844\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2880\u28f4\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u287f\u283f\u281b\u281b\u2806\u2800\u2880\u28fc\u2847\u2800\u28b8\u28c7\u28c0\u2800\u2880\u285e\u281b\u2813\u2836\u2836\u280b\u28bb\u2844\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2880\u28fe\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u284f\u2800\u2800\u2800\u2800\u2800\u28e0\u280b\u2838\u2847\u28b0\u28fe\u2800\u2808\u28c7\u28fe\u2803\u2800\u2800\u2800\u2800\u2800\u2800\u28b1\u2844\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2880\u28fc\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28e7\u2800\u2800\u2800\u2810\u28fb\u28ff\u2833\u28e6\u2847\u28b0\u28ff\u2840\u2880\u28ff\u2803\u2846\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28bb\u28c6\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28e0\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f7\u2844\u2800\u28a0\u284f\u28b8\u2800\u2800\u2819\u281b\u2839\u28f7\u280b\u2801\u2800\u2847\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u283b\u2844\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28f0\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28c6\u2800\u2800\u2818\u2803\u2800\u2800\u2800\u2800\u2808\u2833\u28c4\u2800\u2887\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u283b\u28c4\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u28f0\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2846\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2808\u2833\u28fe\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2819\u281b\u2833\u2826\u28e4\u28c0\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u28b0\u28bf\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u284f\u28bf\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f6\u28e4\u28c0\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2818\u28a7\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2809\u281b\u2833\u2826\u2824\u28c4\u28c0\u2840\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2880\u284f\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f7\u2808\u28bf\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28e6\u28c4\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2819\u28a6\u28c4\u28c0\u28c0\u28c0\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2809\u2809\u281b\u2837\u2826\u28a4\u28c4\u2840", "\u2800\u2800\u2800\u2800\u28f8\u28f7\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2800\u2880\u28fd\u28ff\u28ff\u2859\u28bf\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f7\u28e4\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2830\u2836\u2836\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2808", "\u2800\u2800\u2800\u2800\u28ff\u28b8\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u280b\u2809\u2800\u2808\u281b\u28ff\u28ee\u287b\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f7\u28f6\u28f6\u28e4\u28c4\u28c0\u2800\u2800\u2800\u2809\u2801\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u28ff\u28fc\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u280b\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2800\u2800\u2800\u2800\u2800\u2808\u2819\u28f7\u28dd\u28bb\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u284f\u2809\u2819\u2813\u2836\u28a4\u28c4\u28c0\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u284f\u2800\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2847\u28ff\u2800\u28a0\u2864\u2824\u2824\u2824\u2824\u28ec\u28ff\u28f7\u28fd\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f7\u2847\u2800\u2800\u2800\u2800\u2808\u2809\u281b\u2812\u28a4\u28e4\u28c0\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u285f\u2800\u2808\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28b7\u285f\u28e0\u281f\u2801\u2800\u28c0\u28e0\u28ed\u28ff\u28e7\u28ff\u28e9\u287f\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2847\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2809\u281b\u2836\u2826\u2884\u28c0\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u285f\u2800\u2800\u2800\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28fe\u2837\u2803\u2880\u28e4\u28ff\u28ff\u28ff\u28cb\u28fd\u28db\u28ff\u2849\u2819\u281b\u28bb\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2847\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2808\u2819\u2833\u2826\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u28bd\u28ff\u28b9\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f7\u287f\u2832\u2836\u28e4\u28f6\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28bf\u284f\u2800\u2880\u28ff\u280f\u28bb\u28c7\u2839\u281f\u28c3\u2800\u28f8\u28ff\u2844\u2820\u28fe\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2819\u28ff\u28ff\u28ff\u2847\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2808\u2802\u2884", "\u2800\u2800\u2800\u2800\u28b8\u28ff\u28b8\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u285f\u2800\u2800\u2800\u2800\u2800\u28fb\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u287e\u2800\u2800\u2809\u2800\u2820\u283e\u281b\u281b\u283b\u281b\u2809\u2809\u2809\u2801\u2880\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2800\u2838\u28ff\u28ff\u2847\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2838\u28ff\u285c\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u283e\u28bf\u28ff\u283f\u28bf\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u287f\u2809\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2880\u2800\u2800\u2800\u28f8\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2800\u2800\u28ff\u28ff\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u28ff\u28c7\u28bb\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u280b\u28b8\u28ff\u2800\u2818\u28ff\u2801\u28d8\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u287f\u2801\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2846\u2800\u28ff\u28ff\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u28bb\u28ff\u28fc\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u284f\u2800\u2808\u28bb\u28e6\u28e4\u2874\u281e\u280b\u28bb\u28ff\u28ff\u28ff\u28ff\u287f\u2801\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f7\u2800\u28ff\u28ff\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u28b8\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28e7\u28a4\u28fc\u283f\u281f\u280b\u2800\u2800\u2800\u28fe\u28ff\u28ff\u28ff\u287f\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28ff\u2847\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u285f\u28ff\u28e4\u28ff\u2847\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2838\u28f7\u281a\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2847\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28a0\u28ff\u28ff\u28ff\u28ff\u2803\u2800\u2800\u2800\u2800\u2800\u2800\u2880\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28b0\u28ff\u2801\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2800\u28ff\u287f\u28fc\u2807\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u28bf\u2844\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2847\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28b8\u28ff\u28ff\u28ff\u284f\u2800\u2800\u2800\u2800\u2808\u2803\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2808\u28ff\u28f6\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28fe\u284f\u28e0\u280f\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2808\u28bf\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2847\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28b8\u28ff\u28ff\u28ff\u2801\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28c0\u28e0\u28e4\u28e4\u28f6\u28e4\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28c5\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2808\u28ff\u28ff\u28bb\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f7\u2844\u2800\u2800\u2800\u2800\u2800\u2800\u28b8\u28ff\u28ff\u284f\u2800\u2800\u2800\u2880\u2874\u2896\u28db\u28ed\u28fd\u28ff\u28ff\u28ff\u28f6\u28ff\u28f7\u2800\u2800\u2800\u2800\u2800\u2800\u28bb\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28f9\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2818\u28ff\u28fc\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28c6\u2800\u2800\u2800\u2800\u2800\u28b8\u28ff\u28ff\u2847\u2800\u2800\u2800\u28b8\u28e7\u28ff\u28ff\u28ff\u28ff\u287f\u281f\u281b\u281b\u28bf\u28ff\u2843\u2800\u2800\u2800\u2800\u2800\u28fc\u28ff\u28fe\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2803\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2839\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2819\u28a7\u2840\u2800\u2800\u2800\u2800\u28ff\u28ff\u28c7\u2800\u2800\u2800\u2808\u28bf\u28ff\u280f\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28ff\u2801\u2800\u2800\u2800\u2800\u28f0\u287f\u28bf\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u287f\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2839\u28ff\u28ff\u285f\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28e7\u286e\u28b7\u28c4\u2800\u2800\u2800\u28bb\u284c\u28ff\u2840\u2800\u2800\u2800\u2818\u28ff\u2844\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28ff\u2800\u2800\u2800\u2800\u28f4\u287f\u2881\u287e\u28fb\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u2803\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2818\u28ff\u28f7\u2858\u28bf\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28c6\u2800\u2819\u2837\u28c4\u2800\u2808\u28bf\u28fc\u28e7\u2800\u2800\u2800\u2800\u2808\u283b\u28c4\u2800\u2800\u2800\u2800\u2880\u287c\u2803\u2800\u2800\u2810\u281b\u280b\u28e0\u280f\u2800\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28cb\u281d\u2803\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28b9\u28ff\u287f\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28e7\u2840\u2800\u2808\u281b\u28a6\u28c4\u2849\u2819\u28b7\u28c4\u2800\u2800\u2800\u2800\u2808\u2819\u281b\u281b\u280b\u2809\u2800\u2800\u2800\u2800\u2800\u28a0\u287e\u2803\u2800\u28f8\u28ff\u28ff\u28ff\u28e6\u2859\u283f\u28f7\u2840\u2800\u2800\u2800\u2800\u2880\u28c4\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2820\u280a", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28bf\u28ff\u2801\u2809\u28bb\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28ff\u28e6\u28c0\u2800\u2880\u28fb\u28ff\u2877\u28a6\u28c8\u2801\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2880\u28f4\u280f\u2800\u2800\u28e0\u28ff\u28b9\u28ff\u28ff\u28ff\u28ff\u28f6\u28ff\u28ff\u28e4\u28e4\u28f4\u28fe\u281f\u2801\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2880\u28c0\u2840\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2808\u283b\u28e7\u2840\u2808\u281b\u28bf\u28ff\u28ff\u28bb\u28ff\u28ff\u28ff\u285d\u281b\u2833\u28f6\u28ff\u280f\u28f7\u2840\u2809\u281b\u2832\u2826\u28e4\u28c0\u2840\u2800\u2800\u2800\u2800\u2800\u28e0\u2874\u281f\u2801\u2800\u2800\u2800\u280b\u2801\u28f8\u28ff\u28ff\u28ff\u28ff\u28df\u285b\u281b\u281b\u281b\u280b\u2801\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u28c0\u28e4\u2834\u2812\u281b\u280b\u2809\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800", "\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2800\u2819\u28b7\u28c0\u2800\u28b8\u28bb\u287f\u2800\u2839\u28ff\u28ff\u283f\u28e6\u28c4\u2818\u280b\u2800\u2818\u28e7\u2800\u2800\u2800\u2800\u2800\u2809\u281b\u2813\u2812\u2812\u281a\u281b\u2809\u2800\u2800\u2800     const heat = t < M_SPIRAL ? 0 : Math.min(1, (t - M_SPIRAL) / (M_BANG - M_SPIRAL));
    return { mcx: S.cx - ox, mcy: S.cy - oy + bob, scx: S.cx + ox, scy: S.cy + oy - bob, heat };
  }

  function dot(x, y, I, r, g, b) {
    if (I <= 0.22) return;
    const br = 0.35 + 0.65 * Math.min(1, I * 1.1);
    const q = (Math.min(15, Math.max(0, Math.round(r * br / 17))) << 8) | (Math.min(15, Math.max(0, Math.round(g * br / 17))) << 4) | Math.min(15, Math.max(0, Math.round(b * br / 17)));
    mctx.fillStyle = QCOL[q];
    mctx.fillRect(mOx + Math.round(x) * mSp - 1.3, mOy + Math.round(y) * mSp - 1.3, 2.6, 2.6);
  }

  // where every moon/star dot is at time t (moon gets tidally stretched toward the star)
  function bodyPoint(S, B, i) {
    if (i < S.nm) {
      let dx = B.scx - B.mcx, dy = B.scy - B.mcy; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      const st = 1 + 0.45 * B.heat * B.heat, along = (S.mx[i] * dx + S.my[i] * dy) * (st - 1);
      return [S.mx[i] + along * dx + B.mcx, S.my[i] + along * dy + B.mcy];
    }
    const j = i - S.nm, k = 1 - 0.3 * B.heat;
    return [S.sx[j] * k + B.scx, S.sy[j] * k + B.scy];
  }

  function moonStar(time) {
    if (!ms) measureMoon();
    const S = ms, t = time % M_END;
    const r = moonWrap.getBoundingClientRect();
    mctx.fillStyle = "#08060c"; mctx.fillRect(0, 0, r.width, r.height);
    let fade = 1;
    if (t > M_HOLD) fade = Math.max(0, 1 - (t - M_HOLD) / (M_END - M_HOLD));
    if (t < 1) fade = t;

    for (const [x, y, ph, sp] of S.bg) {
      const tw = Math.sin(t * sp + ph);
      if (tw > 0.1) dot(x, y, 0.35 + 0.3 * tw, 170 * fade, 160 * fade, 200 * fade);
    }

    if (t < M_BANG) {
      const trail = t < M_SPIRAL ? [0] : [0, 0.05, 0.1];
      for (let k = trail.length - 1; k >= 0; k--) {
        const tt = t - trail[k], B = bodies(S, tt), hot = B.heat * B.heat, dim = (1 - k * 0.3) * fade, jit = B.heat * 2.4;
        // moon, lit by the star so its phase follows the orbit
        let Lx = B.scx - B.mcx, Ly = B.scy - B.mcy, Lz = S.Wd * 0.3; const ll = Math.hypot(Lx, Ly, Lz); Lx /= ll; Ly /= ll; Lz /= ll;
        for (let i = 0; i < S.nm; i++) {
          const lam = Math.max(0, S.nX[i] * Lx + S.nY[i] * Ly + S.nZ[i] * Lz);
          let br = lam * S.alb[i] * (0.78 + 0.22 * S.nZ[i]) + 0.018 * S.alb[i];
          br *= 1 + 2.5 * hot;
          if (br <= S.dith[i] * 1.05 + 0.06) continue;
          const [x, y] = bodyPoint(S, B, i);
          const f = Math.min(1.2, 0.4 + 0.6 * br);
          const c = [226 * f, 222 * f, 214 * f].map((v, j) => (v * (1 - hot) + (C_WHITE[j] * 0.6 + C_PINK[j] * 0.4) * hot) * dim);
          dot(x + (S.rnd() - 0.5) * jit, y + (S.rnd() - 0.5) * jit, dim, c[0], c[1], c[2]);
        }
        // star: twinkling glow, breathing spikes
        const tw = 0.82 + 0.18 * Math.sin(tt * 6.3) * Math.sin(tt * 2.1 + 1), reach = 0.7 + 0.3 * tw + 0.3 * B.heat;
        for (let j = 0; j < S.ns; j++) {
          const core = S.sk[j] === 0 && S.sb[j] >= 0.999;
          if (S.sk[j] === 1 && S.sf[j] >= reach) continue;
          if (!core && Math.sin(tt * 9 + S.sph[j]) <= -0.6) continue;
          const [x, y] = bodyPoint(S, B, S.nm + j);
          const b = Math.min(1.3, S.sb[j] * tw * (1 + hot)), f = 0.35 + 0.65 * b;
          const c = S.scol[j].map((v, q) => Math.min(255, (v * f * (1 - hot) + C_WHITE[q] * hot) * dim));
          dot(x + (S.rnd() - 0.5) * jit, y + (S.rnd() - 0.5) * jit, dim, c[0], c[1], c[2]);
        }
      }
      return;
    }

    // after the bang: every target dot flies out, then home to its place in the drawing
    const B0 = bodies(S, M_BANG - 1e-3), kd = 2.2, tb = t - M_BANG;
    if (tb < 1.6) {
      if (tb < 0.5) {
        const rr = 4 + tb * 50, a = 1 - tb / 0.5;
        for (let y = -Math.ceil(rr); y <= rr; y++) for (let x = -Math.ceil(rr); x <= rr; x++)
          if (x * x + y * y <= rr * rr) dot(S.cx + x, S.cy + y, a * 0.9, 255, 248, 252);
      }
      const rs = tb * 140, n = Math.floor(20 + rs * 4), a = Math.max(0, 1 - tb / 1.6);
      for (let i = 0; i < n; i++) { const an = i / n * 6.283; dot(S.cx + Math.cos(an) * rs, S.cy + Math.sin(an) * rs * 0.8, a, 255 * 0.6 + 255 * 0.4, 143 * 0.6 + 248 * 0.4, 200 * 0.6 + 252 * 0.4); }
    }
    const trails = t > M_FORM ? [0] : [0, 0.05, 0.1];
    for (let kk = trails.length - 1; kk >= 0; kk--) {
      const tt = t - trails[kk], te = Math.max(0, tt - M_BANG), ex = (1 - Math.exp(-kd * te)) / kd;
      const heat = Math.max(0, Math.min(1, 1 - (tt - M_BANG) / 1.2)), inten = (1 - kk * 0.3) * fade, cm = 1 - kk * 0.25;
      for (let i = 0; i < S.N; i++) {
        const [px0, py0] = bodyPoint(S, B0, S.src[i]);
        const qx = px0 + S.vx[i] * ex, qy = py0 + S.vy[i] * ex;
        const p = easeP((tt - M_EXPLODE - S.delay[i]) / 1.8);
        const dx = S.tx[i] - qx, dy = S.ty[i] - qy, dl = Math.hypot(dx, dy) + 1e-6, sw = S.swirl[i] * Math.sin(Math.PI * p);
        const x = qx + dx * p - dy / dl * sw, y = qy + dy * p + dx / dl * sw;
        const f = S.ty[i] / S.Hd, tc0 = C_PINK[0] * (1 - f) + C_LAV[0] * f, tc1 = C_PINK[1] * (1 - f) + C_LAV[1] * f, tc2 = C_PINK[2] * (1 - f) + C_LAV[2] * f;
        dot(x, y, inten,
          (tc0 * p + (255 * heat + 255 * (1 - heat)) * (1 - p)) * cm,
          (tc1 * p + (248 * heat + 143 * (1 - heat)) * (1 - p)) * cm,
          (tc2 * p + (252 * heat + 200 * (1 - heat)) * (1 - p)) * cm);
      }
    }
    if (t > M_FORM - 0.5) {
      const sweep = (t - M_FORM) / (M_HOLD - M_FORM) * (S.Wd + 80) - 40;
      for (let i = 0; i < S.N; i++) {
        const f = S.ty[i] / S.Hd, g = 1 + Math.exp(-(((S.tx[i] - sweep) / 14) ** 2)) * 0.55;
        dot(S.tx[i], S.ty[i], fade, Math.min(255, (C_PINK[0] * (1 - f) + C_LAV[0] * f) * g), Math.min(255, (C_PINK[1] * (1 - f) + C_LAV[1] * f) * g), Math.min(255, (C_PINK[2] * (1 - f) + C_LAV[2] * f) * g));
      }
    }
  }

  moonWrap.addEventListener("pointerdown", () => { mT0 = performance.now(); });

  // ================= Smoke =================
  const smokeWrap = document.getElementById("smokeWrap");
  const smokeCanvas = document.getElementById("smokeCv");
  const sctx = smokeCanvas.getContext("2d");
  let sSp = 4, sOx = 0, sOy = 0, SW = 200, SH = 150, sLast = null;
  const cig = { lit: false, litAt: 0, burn: 0, ash: 0, puff: 0, outAt: -99, nextHeart: 0, spawnAcc: 0 };
  let smoke = [], sHearts = [], sSparks = [], ashBits = [];
  let cigPts = null;

  function measureSmoke() {
    if (smokeWrap.hidden) return;
    const r = smokeWrap.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    smokeCanvas.width = Math.max(1, Math.round(r.width * dpr)); smokeCanvas.height = Math.max(1, Math.round(r.height * dpr));
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sSp = r.width < 500 ? 3 : 4;
    const W = Math.floor(r.width / sSp), H = Math.floor(r.height / sSp);
    sOx = (r.width - W * sSp) / 2 + sSp / 2; sOy = (r.height - H * sSp) / 2 + sSp / 2;
    if (W !== SW || H !== SH || !cigPts) { SW = W; SH = H; buildCig(); }
  }

  // the cigarette, as dots in its own (u along, v across) coordinates
  function buildCig() {
    const L = Math.min(SW * 0.6, 150), T = Math.max(5, Math.round(L * 0.075));
    const rnd = mulberry(11);
    const pts = [];
    for (let u = 0; u < L; u += 0.5) for (let v = -T / 2; v <= T / 2; v += 0.5) {
      const shade = 0.72 + 0.28 * Math.cos((v / (T / 2 + 0.5)) * Math.PI / 2);
      let c;
      if (u < L * 0.28) {
        const s = rnd() < 0.18 ? 0.8 : 1;
        c = [255 * s, 150 * s, 196 * s];                   // pink filter
        if (u > L * 0.28 - 2) c = [255, 222, 238];          // pale pink band
      } else c = [246, 243, 247];                           // white paper
      pts.push({ u, v, c: c.map(x => x * shade), spk: rnd() });
    }
    cigPts = { L, T, pts, x0: (SW - L) / 2, y0: SH * 0.8, tilt: -0.1 };
  }

  function cigXY(u, v) {
    const { x0, y0, tilt, L } = cigPts, ca = Math.cos(tilt), sa = Math.sin(tilt);
    const du = u - L / 2;
    return [SW / 2 + du * ca - v * sa, y0 + du * sa + v * ca];
  }

  function sdot(x, y, a, r, g, b) {
    if (a <= 0.02) return;
    const q = (Math.min(15, Math.max(0, Math.round(r * a / 17))) << 8) | (Math.min(15, Math.max(0, Math.round(g * a / 17))) << 4) | Math.min(15, Math.max(0, Math.round(b * a / 17)));
    sctx.fillStyle = QCOL[q];
    sctx.fillRect(sOx + Math.round(x) * sSp - 1.3, sOy + Math.round(y) * sSp - 1.3, 2.6, 2.6);
  }

  function emberUV() { const { L } = cigPts; return L - cig.burn; } // where paper meets the burning end

  function spawnHeart(t) {
    const [ex, ey] = cigXY(emberUV() + cig.ash, -cigPts.T / 2);
    const s = Math.max(1.2, Math.min(SW, SH) * 0.016);
    const hw = 18 * s * 1.1 + 4, cx = Math.max(hw, Math.min(SW - hw, ex - SW * 0.05)), cy = Math.max(10 * s, ey - SH * 0.47);
    sHearts.push({ born: t, cx, cy, s, parts: [], acc: 0, side: 0 });
  }
  const heartActive = t => sHearts.some(h => t - h.born < 6);

  // one continuous path: up from the ember as a wavy stem, then around one half of the heart
  function heartPath(h, ex, ey, age, side) {
    const s = h.s, beat = age > 2.4 ? 1 + 0.04 * Math.sin(age * 6) : 1;
    const bx = h.cx, by = h.cy + 17 * s * beat;
    const pts = [];
    for (let i = 0; i <= 40; i++) {
      const f = i / 40, cx = ex, cy = (ey + by) / 2;
      let x = (1 - f) ** 2 * ex + 2 * (1 - f) * f * cx + f * f * bx;
      const y = (1 - f) ** 2 * ey + 2 * (1 - f) * f * cy + f * f * by;
      x += Math.sin(f * Math.PI * 2.2 + age * 1.2) * SW * 0.025 * Math.sin(f * Math.PI);
      pts.push([x, y]);
    }
    for (let i = 1; i <= 60; i++) {
      const th = Math.PI + (side ? 1 : -1) * Math.PI * (i / 60);
      const hx = 16 * Math.sin(th) ** 3, hy = -(13 * Math.cos(th) - 5 * Math.cos(2 * th) - 2 * Math.cos(3 * th) - Math.cos(4 * th));
      pts.push([h.cx + hx * s * 1.1 * beat, h.cy + hy * s * beat]);
    }
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    return { pts, cum, total: cum[cum.length - 1], stemEnd: cum[40] / cum[cum.length - 1] };
  }
  function along(path, d) {
    const { pts, cum } = path;
    let lo = 0, hi = cum.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= d) lo = m; else hi = m; }
    const seg = cum[hi] - cum[lo] || 1, k = Math.max(0, Math.min(1, (d - cum[lo]) / seg));
    const ax = pts[lo][0], ay = pts[lo][1], bx = pts[hi][0], by = pts[hi][1];
    const tx = (bx - ax) / seg, ty = (by - ay) / seg;
    return [ax + (bx - ax) * k, ay + (by - ay) * k, -ty, tx, tx, ty];
  }

  function smokeScene(t) {
    if (!cigPts) measureSmoke();
    const dt = sLast === null ? 0.016 : Math.min(0.05, Math.max(0, t - sLast)); sLast = t;
    const r = smokeWrap.getBoundingClientRect();
    const g = sctx.createRadialGradient(r.width / 2, r.height * 0.75, 10, r.width / 2, r.height * 0.6, r.width * 0.8);
    g.addColorStop(0, "#160e13"); g.addColorStop(1, "#07050a");
    sctx.fillStyle = g; sctx.fillRect(0, 0, r.width, r.height);
    const { L, T, pts } = cigPts;

    // burning down, ash growing and falling, going out at the filter
    if (cig.lit) {
      cig.burn += dt * (L * 0.6 / 45) * (1 + cig.puff * 2);
      cig.ash += dt * 0.5;
      if (cig.ash > Math.min(L * 0.1, 10) && Math.random() < 0.01) {
        for (let i = 0; i < 25; i++) { const [x, y] = cigXY(emberUV() + Math.random() * cig.ash, (Math.random() - 0.5) * T); ashBits.push({ x, y, vx: (Math.random() - 0.5) * 6, vy: 0, life: 0 }); }
        cig.ash = 0;
      }
      if (cig.burn >= L * 0.66) { cig.lit = false; cig.outAt = t; }
      if (t > cig.nextHeart && !heartActive(t)) { spawnHeart(t); cig.nextHeart = t + 7.5; }
    } else if (cig.burn > 0 && t - cig.outAt > 5) { cig.burn = 0; cig.ash = 0; }
    cig.puff = Math.max(0, cig.puff - dt * 0.9);

    // soft shadow under the cigarette
    for (let i = 0; i < 160; i++) {
      const u = (i / 160) * (L - cig.burn), [x, y] = cigXY(u, T * 1.6);
      if ((i * 7) % 3 === 0) sdot(x, y + 2 + (i % 2), 0.18, 120, 90, 110);
    }

    // body
    const end = emberUV();
    for (const p of pts) {
      if (p.u > end) continue;
      const [x, y] = cigXY(p.u, p.v);
      let c = p.c;
      if (cig.lit || cig.burn > 0) {
        const d = end - p.u;                     // char line just behind the ember
        if (d < 2.5) c = [90, 70, 60];
        else if (d < 5) c = c.map(v => v * (0.6 + 0.08 * d));
      }
      sdot(x, y, 1, c[0], c[1], c[2]);
    }
    // the end: tobacco when unlit, ember + ash when lit
    const fl = 0.75 + 0.25 * Math.sin(t * 13) * Math.sin(t * 5.3 + 1) + cig.puff * 0.8;
    if (!cig.lit) {
      for (let v = -T / 2; v <= T / 2; v++) for (let k = 0; k < 2; k++) {
        const [x, y] = cigXY(end - k, v);
        const smoulder = cig.burn > 0 ? Math.max(0, 1 - (t - cig.outAt) / 2) : 0;
        sdot(x, y, 1, 150 + 100 * smoulder, 100 - 30 * smoulder, 58 - 30 * smoulder);
      }
    } else {
      for (let u = 0; u < cig.ash; u++) for (let v = -T / 2; v <= T / 2; v++) {
        const [x, y] = cigXY(end + 1 + u, v);
        const s = 0.75 + 0.25 * ((u * 13 + v * 7) % 5) / 5;
        sdot(x, y, 1, 160 * s, 150 * s, 156 * s);
      }
      for (let u = -1; u <= 1; u++) for (let v = -T / 2; v <= T / 2; v++) {
        const [x, y] = cigXY(end + u, v);
        const hot = Math.min(1.4, fl * (Math.random() * 0.4 + 0.8));
        sdot(x, y, Math.min(1, hot), 255, 90 + 120 * Math.max(0, hot - 0.8), 40 + 60 * Math.max(0, hot - 1));
      }
      // glow
      const [gx, gy] = cigXY(end, 0), R = T * (1.6 + cig.puff * 1.5);
      for (let i = 0; i < 90; i++) {
        const a = Math.random() * 6.28, d = Math.sqrt(Math.random()) * R;
        sdot(gx + Math.cos(a) * d, gy + Math.sin(a) * d, (1 - d / R) * 0.55 * fl, 255, 120, 60);
      }
    }
    // lighter flame for a moment after lighting
    if (cig.lit && t - cig.litAt < 1.1) {
      const [fx, fy] = cigXY(end + 4, 0), k = 1 - (t - cig.litAt) / 1.1;
      for (let i = 0; i < 220; i++) {
        const yy = Math.random(), w = Math.sin(yy * Math.PI) * 4 * (0.7 + 0.3 * Math.sin(t * 20 + yy * 6)) * k;
        const x = fx + (Math.random() - 0.5) * 2 * w + Math.sin(t * 9 + yy * 5) * 1.5, y = fy + 6 - yy * 16 * k;
        sdot(x, y, 0.9 * k, 255, 170 + 85 * (1 - yy), 60 + 160 * (1 - yy) * (yy < 0.25 ? 1 : 0));
      }
    }

    // free smoke from the ember
    if (cig.lit) {
      cig.spawnAcc += dt * (110 + cig.puff * 200) * (heartActive(t) ? 0.2 : 1);
      while (cig.spawnAcc >= 1) {
        cig.spawnAcc--;
        const [x, y] = cigXY(end + cig.ash * 0.5, -T / 2);
        smoke.push({ x: x + (Math.random() - 0.5) * 2, y, vx: (Math.random() - 0.5) * 3, vy: -10 - Math.random() * 8, life: 0, max: 3 + Math.random() * 2.5, pink: false });
      }
    }
    const flow = (x, y) => Math.sin(y * 0.09 + t * 1.3) * 7 + Math.sin(x * 0.05 - t * 0.9) * 4 + Math.sin((x + y) * 0.03 + t * 0.5) * 3;
    smoke = smoke.filter(p => (p.life += dt) < p.max && p.y > -5);
    for (const p of smoke) {
      p.vx += (flow(p.x, p.y) * (0.6 + p.life * 0.4) - p.vx) * dt * 0.9 + (Math.random() - 0.5) * 40 * dt * p.life;
      p.vy *= 1 - dt * 0.15;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const a = (1 - p.life / p.max) * Math.min(1, p.life * 3) * 0.85;
      if (Math.random() < a + 0.15) sdot(p.x, p.y, Math.min(1, a * 1.25 + 0.15), p.pink ? 250 : 225, p.pink ? 185 : 220, p.pink ? 225 : 236);
    }

    // hearts drawn by the smoke stream itself
    const [hex, hey] = cigXY(end + cig.ash * 0.5, -T / 2);
    for (const h of sHearts) {
      const age = t - h.born;
      const paths = [heartPath(h, hex, hey, age, 0), heartPath(h, hex, hey, age, 1)];
      if (age < 4 && cig.lit) {
        h.acc += dt * 300;
        while (h.acc >= 1) {
          h.acc--; h.side ^= 1;
          const g = (Math.random() + Math.random() + Math.random() - 1.5) * 1.4;
          h.parts.push({ side: h.side, d: 0, off: g, ph: Math.random() * 6.28, sp: 0.88 + Math.random() * 0.24, life: 0, arrived: -1 });
        }
      }
      const release = age > 6.2;
      for (const q of h.parts) {
        const P = paths[q.side];
        q.life += dt;
        q.d = Math.min(P.total, q.d + dt * q.sp * P.total / 2.4);
        if (q.d >= P.total && q.arrived < 0) q.arrived = q.life;
        const fd = q.d / P.total;
        const [px, py, nx, ny, tx, ty] = along(P, q.d);
        const spread = 0.6 + 1.4 * Math.min(1, fd * 1.4);
        const x = px + nx * (q.off * spread + Math.sin(t * 3 + q.ph) * 0.4), y = py + ny * (q.off * spread + Math.sin(t * 3 + q.ph) * 0.4);
        if (release) { // the heart lets go and drifts apart as ordinary smoke
          smoke.push({ x, y, vx: tx * 4 + (Math.random() - 0.5) * 4, vy: ty * 4 - 4 - Math.random() * 4, life: 0, max: 1.8 + Math.random() * 1.6, pink: fd > P.stemEnd });
          continue;
        }
        let a = Math.min(1, q.life * 3) * 0.9;
        if (q.arrived >= 0) a *= Math.max(0, 1 - (q.life - q.arrived) / 0.3);
        const m = Math.max(0, Math.min(1, (fd - P.stemEnd + 0.12) / 0.17));
        if (Math.random() < a + 0.12) sdot(x, y, Math.min(1, a * 1.2 + 0.15), 225 + 25 * m, 220 - 45 * m, 236 - 16 * m);
      }
      if (release) h.parts = [];
      else h.parts = h.parts.filter(q => q.arrived < 0 || q.life - q.arrived < 0.3);
    }
    sHearts = sHearts.filter(h => t - h.born <= 6.2);

    // sSparks and falling ash
    sSparks = sSparks.filter(s => (s.life += dt) < s.max);
    for (const s of sSparks) { s.vy += 30 * dt; s.x += s.vx * dt; s.y += s.vy * dt; sdot(s.x, s.y, 1 - s.life / s.max, 255, 200, 90); }
    ashBits = ashBits.filter(b => (b.life += dt) < 1.6);
    for (const b of ashBits) { b.vy += 40 * dt; b.x += b.vx * dt; b.y += b.vy * dt; sdot(b.x, b.y, 1 - b.life / 1.6, 150, 146, 142); }

    // unlit: the tip glows faintly now and then, inviting a click

    }
    const dn = Math.hypot(sx - NOSE[0], sy - NOSE[1], sz - NOSE[2]);
    if (dn < 0.09) return { dark: true, ch: Math.abs(sx) > 0.03 ? "@" : "v" };            // nose
    if (sz > MUZ_C[2] && sy < MUZ_C[1] - 0.06 && sy > MUZ_C[1] - 0.12 && Math.abs(sx) < 0.16) return { dark: true, ch: "-" }; // mouth
    if (sz > MUZ_C[2] + 0.05 && sy > MUZ_C[1] - 0.05 && Math.abs(sx) > 0.09 && Math.abs(sx) < 0.24 && Math.sin(sx * 80) * Math.sin(sy * 80) > 0.5) return { dark: true, ch: "." };
    return { tint: -0.12 };  // he's a darker pink than everything around him
  }

  function sealScene(t) {
    const dt = kLast === null ? 0.016 : Math.min(0.05, Math.max(0, t - kLast)); kLast = t;
    const r = sealWrap.getBoundingClientRect();
    kctx.fillStyle = "#0e0710"; kctx.fillRect(0, 0, r.width, r.height);
    kctx.font = `bold ${kFs}px "JetBrains Mono", ui-monospace, monospace`; kctx.textBaseline = "top";

    const sp = (t - seal.spinAt) / 1.4, spinning = sp >= 0 && sp < 1;
    if (spinning && !seal.landed && sp > 0.86) { seal.landed = true; seal.ripples.push({ at: t, big: 1 }); }
    const th = (spinning ? easeP(sp) * Math.PI * 2 : 0) + Math.sin(t * 0.45) * 0.12;
    const lift = spinning ? Math.sin(Math.PI * sp) * 0.28 : Math.sin(t * 1.1) * 0.02;
    const cs = Math.cos(th), sn = Math.sin(th);
    const bob = Math.sin(t * 1.1 + 0.6) * 0.015;  // the tub floats too

    const tilt = 0.22, fwd = [0, -Math.sin(tilt), -Math.cos(tilt)], up = [0, Math.cos(tilt), -Math.sin(tilt)];
    const scalePx = Math.min(r.height * 0.34, r.width * (r.width < 500 ? 0.48 : 0.3));
    const cxPx = r.width / 2, cyPx = r.height * 0.5, TGT = 0.72;
    const L = [-0.28, 0.5, 0.82], ln = Math.hypot(...L); L[0] /= ln; L[1] /= ln; L[2] /= ln;
    const draw = (col, row, ch, c) => { kctx.fillStyle = kStyle(c); kctx.fillText(ch, col * kCW, row * kCH); };
    const proj = (X, Y, Z) => [cxPx + X * scalePx, cyPx - ((Y - TGT) * up[1] + Z * up[2]) * scalePx];

    for (let row = 0; row < KR; row++) for (let col = 0; col < KC; col++) {
      const px = (col + 0.5) * kCW, py = (row + 0.5) * kCH;
      const wx = (px - cxPx) / scalePx, wy = -(py - cyPx) / scalePx;
      const o = [wx, TGT + wy * up[1] - fwd[1] * 6, wy * up[2] - fwd[2] * 6];
      const tw = fwd[1] < 0 ? (0 - o[1]) / fwd[1] : 1e9;
      let tt = 0, hit = false, P = null;
      if (Math.abs(wx) < 1.0 && wy > -1.1 && wy < 1.4) {
        for (let s = 0; s < 64; s++) {
          const X = o[0] + fwd[0] * tt, Y = o[1] + fwd[1] * tt - bob, Z = o[2] + fwd[2] * tt;
          P = scene(X, Y, Z, cs, sn, lift);
          if (P.d < 0.003) { hit = true; P.x = X; P.y = Y; P.z = Z; break; }
          tt += P.d * 0.9;
          if (tt > 12 || tt > tw) break;
        }
      }
      if (hit && tt < tw) {
        const e = 0.005, f = (a, b, c) => scene(a, b, c, cs, sn, lift).d;
        let nx = f(P.x + e, P.y, P.z) - f(P.x - e, P.y, P.z), ny = f(P.x, P.y + e, P.z) - f(P.x, P.y - e, P.z), nz = f(P.x, P.y, P.z + e) - f(P.x, P.y, P.z - e);
        const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
        const diff = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
        const view = Math.max(0, -(nx * fwd[0] + ny * fwd[1] + nz * fwd[2]));
        const spec = Math.pow(Math.max(0, ny * 0.55 + nz * 0.6 - nx * 0.35), 20) * 0.45;
        const m = material(P);
        if (m.dark) { draw(col, row, m.ch, [205, 35, 120]); continue; }
        const lum = Math.max(0, Math.min(1, 0.22 + 0.7 * diff + spec + Math.pow(1 - view, 3) * 0.25 + m.tint * 0.6));
        const ch = m.ch || K_RAMP[Math.min(K_RAMP.length - 1, 1 + Math.floor(lum * (K_RAMP.length - 2)))];
        draw(col, row, ch, pinkAt(lum * 0.92 + Math.max(0, m.tint) * 0.3));
        continue;
      }
      if (tw < 1e8) { // the pool, all the way back
        const X = o[0] + fwd[0] * tw, Z = o[2] + fwd[2] * tw, rd = Math.hypot(X, Z + 0.15);
        let w = 0.24 + 0.14 * Math.sin(X * 2.4 + Z * 1.3 + t * 1.1) * Math.sin(Z * 3.1 - t * 0.8) + 0.08 * Math.sin(X * 7 - Z * 5 + t * 2);
        w += 0.12 * Math.sin(rd * 10 - t * 3) * Math.exp(-(rd - 0.7) * 1.5) * (rd > 0.7 ? 1 : 0);
        for (const rp of seal.ripples) {
          const a = t - rp.at, ring = rd - (0.75 + a * 1.3);
          w += Math.exp(-ring * ring * 30) * (1 - a / 2.4) * 0.55 * rp.big;
        }
        if (Math.abs(X) < 0.75 && Z < 0.5 && Z > -0.9) w -= 0.12;   // his reflection darkens the water
        const fade = Math.max(0.15, Math.min(1, 1 - (-Z - 1) / 9));
        w *= fade;
        const ch = w > 0.44 ? "≈" : w > 0.35 ? "~" : w > 0.27 ? "-" : w > 0.2 && ((col + row) & 1) ? "." : "";
        if (ch) draw(col, row, ch, pinkAt(0.2 + w * 0.7));
      }
    }

    // long whiskers, drawn as character lines from the sides of his muzzle
    if (cs > 0.2) {
      const toWorld = (p) => { // seal frame -> world
        const x = p[0], z = p[2] + 0.25;
        return [x * cs + z * sn, p[1] + lift + bob, -x * sn + z * cs - 0.25];
      };
      for (const s of [-1, 1]) for (let k = 0; k < 7; k++) {
        const root = [s * 0.17, MUZ_C[1] - 0.02 + (k - 3) * 0.025, MUZ_C[2] + 0.2];
        const ang = (k - 3) * 0.16 + Math.sin(t * 1.2 + k) * 0.02, len = 0.55 + (k % 3) * 0.12;
        const tip = [root[0] + s * Math.cos(ang) * len, root[1] + Math.sin(ang) * len * 0.8, root[2] + 0.05];
        const [ax, ay] = proj(...toWorld(root)), [bx, by] = proj(...toWorld(tip));
        const n = Math.ceil(Math.hypot(bx - ax, by - ay) / kCW);
        const slope = (by - ay) / (bx - ax || 1e-6);
        const ch = Math.abs(slope) < 0.25 ? "-" : (slope * s > 0 ? "\\" : "/");
        for (let i = 2; i < n; i++) {
          const px = ax + (bx - ax) * i / n, py = ay + (by - ay) * i / n;
          draw(Math.floor(px / kCW), Math.floor(py / kCH), ch, pinkAt(0.85 - i / n * 0.3));
        }
      }
      for (const s of [-1, 1]) for (let k = 0; k < 3; k++) { // brow whiskers
        const root = [s * (0.2 + k * 0.06), 1.36, 0.28];
        const tip = [root[0] + s * 0.12, root[1] + 0.32 + k * 0.05, root[2]];
        const [ax, ay] = proj(...toWorld(root)), [bx, by] = proj(...toWorld(tip));
        const n = Math.ceil(Math.hypot(bx - ax, by - ay) / kCH);
        for (let i = 1; i < n; i++) draw(Math.floor((ax + (bx - ax) * i / n) / kCW), Math.floor((ay + (by - ay) * i / n) / kCH), s > 0 ? "/" : "\\", pinkAt(0.8));
      }
    }

    seal.ripples = seal.ripples.filter(rp => t - rp.at < 2.4);
    if (Math.random() < dt * 0.4) seal.ripples.push({ at: t, big: 0.35 });
  }

  sealWrap.addEventListener("pointerdown", () => {
    const t = (performance.now() - t0) / 1000;
    if (t - seal.spinAt > 1.4) { seal.spinAt = t; seal.landed = false; }
  });

  // ================= Views + loop =================
  function show(v) {
    view = ["moon", "fireworks", "bunny", "her", "smoke", "vape", "botan"].includes(v) ? v : "moon";
    document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === view));
    wrap.hidden = view !== "bunny";
    artWrap.hidden = view !== "her";
    fwWrap.hidden = view !== "fireworks";
    moonWrap.hidden = view !== "moon";
    smokeWrap.hidden = view !== "smoke";
    vapeWrap.hidden = view !== "vape";
    sealWrap.hidden = view !== "botan";
    if (view === "moon") mT0 = performance.now();
    try { history.replaceState(null, "", "#" + view); } catch (e) {}
    measure(); measureArt(); measureFw(); measureMoon(); measureSmoke(); measureVape(); measureSeal();
  }
  document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => show(b.dataset.view)));

  const t0 = performance.now();
  function frame(now) {
    const t = (now - t0) / 1000;
    if (view === "moon") {
      moonStar(Math.max(0, now - mT0) / 1000);
    } else if (view === "fireworks") {
      fireworks(t);
    } else if (view === "botan") {
      sealScene(t);
    } else if (view === "vape") {
      vapeScene(t);
    } else if (view === "smoke") {
      smokeScene(t);
    } else if (view === "bunny") {
      const out = bunny(t);
      let s = "";
      for (let y = 0; y < rows; y++) s += out.slice(y * cols, y * cols + cols).join("") + "\n";
      screen.textContent = s;
    } else {
      pond(t);
    }
    if (reduce) setTimeout(() => requestAnimationFrame(frame), 120); else requestAnimationFrame(frame);
  }

  new ResizeObserver(() => { measure(); measureArt(); measureFw(); measureMoon(); measureSmoke(); measureVape(); measureSeal(); }).observe(document.body);
  document.fonts.ready.then(() => { measure(); measureArt(); measureFw(); measureMoon(); measureSmoke(); measureVape(); measureSeal(); });
  show(location.hash.slice(1));
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
